name: fraicheur
on:
  schedule:
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
concurrency:
  group: robin-core-fraicheur
  cancel-in-progress: false
jobs:
  fraicheur:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      ACTIVE_GENERATION: ${{ vars.ROBIN_AUTONOMOUS_RELAY_GENERATION }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Arrêt réussi sans secrets de collecte
        id: gate
        env:
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
        run: python scripts/collecte_relais.py gate
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: steps.gate.outputs.ready == 'true'
        with: {python-version: '3.12'}
      - if: steps.gate.outputs.ready == 'true'
        run: python -m pip install pydantic==2.14.0 boto3==1.43.110
      - name: Créneau livré et incidents de toutes les tentatives
        if: steps.gate.outputs.ready == 'true'
        run: python -I scripts/fraicheur.py
