name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install dependencies used by the copied tests
        run: >-
          python -m pip install
          pytest==9.1.1 ruff==0.16.10 pydantic==2.14.0
          PyYAML==6.0.3 boto3==1.43.110
      - name: Ruff
        run: ruff check .
      - name: Pytest and dependency audit without external network
        run: python scripts/tracer_dependances.py
