name: jumeau
on:
  schedule:
    - cron: '17 */2 * * *'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  jumeau:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pydantic==2.14.0 boto3==1.43.110
      - name: Comparaison exhaustive sans fournisseur ni R2
        env:
          NG_ARTIFACTS_READ_TOKEN: ${{ secrets.NG_ARTIFACTS_READ_TOKEN }}
        run: python scripts/jumeau.py
      - name: Résumé du contrôle
        if: always()
        run: cat reports/jumeau/rapport.md >> "$GITHUB_STEP_SUMMARY"
      - name: Rapport du jumeau
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jumeau-${{ github.run_id }}
          path: reports/jumeau/
          if-no-files-found: error
