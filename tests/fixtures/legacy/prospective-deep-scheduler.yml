name: "61 - Robin autonomous lab — established scheduler"
run-name: robin-${{ inputs.mode || 'watchdog' }}-${{ inputs.origin || 'schedule' }}-${{ inputs.generation || 'none' }}-${{ inputs.chain_id || github.run_id }}-${{ inputs.sequence || '0' }}

on:
  schedule:
    - cron: "13 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Provider-free probe or admitted recurring collection"
        required: true
        type: choice
        default: probe
        options:
          - probe
          - collect
      origin:
        description: "Manual bootstrap or automatic relay"
        required: true
        type: choice
        default: bootstrap
        options:
          - bootstrap
          - relay
      generation:
        description: "Immutable trigger-recovery manifest SHA-256"
        required: true
        type: string
        default: "4c150973fc3d486e3738f80716019839ac2c4126644849d336e267e6929e6d87"
      chain_id:
        description: "Root GitHub run id (automatic relays only)"
        required: true
        type: string
        default: "0"
      parent_run_id:
        description: "Direct parent GitHub run id (automatic relays only)"
        required: true
        type: string
        default: "0"
      sequence:
        description: "Monotonic relay sequence (automatic relays only)"
        required: true
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: >-
    robin-autonomous-lab-20261005-${{
      github.event_name == 'schedule' && 'seed-control' ||
      (inputs.origin == 'bootstrap' && 'seed-control' ||
      (inputs.origin == 'relay' && github.actor == 'github-actions[bot]' && 'relay' || github.run_id))
    }}
  queue: max

env:
  STORAGE_PAUSED: "true"
  P3_P4_PAUSED: "true"
  PRODUCTION_LOCKED: "true"
  REAL_BETS: "false"
  NO_BET_DEFAULT: "true"
  PROMOTION_LOCKED: "true"
  SOCIAL_PUBLISHING_ENABLED: "false"
  DEMO_MODE_ENABLED: "false"
  API_FOOTBALL_CALLS_ALLOWED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  bootstrap:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.origin == 'bootstrap' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate provider-free bootstrap and dispatch first automatic relay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ORIGIN: ${{ inputs.origin }}
          GENERATION: ${{ inputs.generation }}
          CHAIN_ID: ${{ inputs.chain_id }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          SEQUENCE: ${{ inputs.sequence }}
          ACTIVE_GENERATION: ${{ vars.ROBIN_AUTONOMOUS_RELAY_GENERATION }}
          EXPECTED_GENERATION: "4c150973fc3d486e3738f80716019839ac2c4126644849d336e267e6929e6d87"
          EXPECTED_SOURCE_SHA256: "1bd2073ac01f68fbaa1de9c190642245c2bf8acf7c3611f69f706159df96821d"
          EXPECTED_EXPIRES_AT: "2026-11-03T23:59:59Z"
        run: |
          set -euo pipefail
          umask 077
          read_gh_json() {
            local label="$1"
            local endpoint="$2"
            local payload=""
            local attempt
            for attempt in 1 2 3; do
              if payload="$(timeout --kill-after=5s 20s gh api "$endpoint")" && [[ -n "$payload" ]] && jq -e . >/dev/null 2>&1 <<<"$payload"; then
                printf '%s\n' "$payload"
                return 0
              fi
              echo "GitHub API JSON read attempt $attempt/3 failed: $label" >&2
              (( attempt == 3 )) || sleep "$attempt"
            done
            echo "GitHub API JSON read failed after 3 attempts: $label" >&2
            return 1
          }
          validate_documentary_continuity() {
            local base_sha="$1"
            local head_sha="$2"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --force origin "$head_sha"
            python -I scripts/validate_robin_documentary_continuity.py \
              --repository . --base "$base_sha" --head "$head_sha"
          }
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_ACTOR" == "dddur75" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "dddur75/robin-stades-ng/.github/workflows/prospective-deep-scheduler.yml@refs/heads/main" ]]
          [[ "$MODE" == "probe" || "$MODE" == "collect" ]]
          [[ "$ORIGIN" == "bootstrap" ]]
          [[ "$GENERATION" == "$EXPECTED_GENERATION" ]]
          [[ "$CHAIN_ID" == "0" && "$PARENT_RUN_ID" == "0" && "$SEQUENCE" == "0" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-trigger-recovery-v2-20261005.json | cut -d' ' -f1)" == "$EXPECTED_GENERATION" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-TRIGGER-RECOVERY-V2-2026-10-05.md | cut -d' ' -f1)" == "$EXPECTED_SOURCE_SHA256" ]]
          current_main="$(read_gh_json main-ref "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_main_sha="$(jq -r .object.sha <<<"$current_main")"
          validate_documentary_continuity "$GITHUB_SHA" "$current_main_sha"
          if [[ "$MODE" == "collect" ]]; then
            [[ "$ACTIVE_GENERATION" == "$EXPECTED_GENERATION" ]]
          fi
          environment="$(read_gh_json relay-environment "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1")"
          expected_wait="1"
          [[ "$MODE" == "probe" ]] || expected_wait="60"
          expiry_epoch="$(date -u -d "$EXPECTED_EXPIRES_AT" +%s)"
          current_epoch="$(date -u +%s)"
          required_seconds="$((2 * expected_wait * 60 + 600))"
          if [[ "$MODE" == "collect" ]]; then
            required_seconds="$((expected_wait * 60 + 10800))"
          fi
          (( current_epoch + required_seconds <= expiry_epoch ))
          [[ "$(jq -r '[.protection_rules[].type] | sort == ["branch_policy", "wait_timer"]' <<<"$environment")" == "true" ]]
          [[ "$(jq -r '[.protection_rules[] | select(.type == "wait_timer") | .wait_timer] | if length == 1 then .[0] else -1 end' <<<"$environment")" == "$expected_wait" ]]
          [[ "$(jq -r '.deployment_branch_policy.protected_branches' <<<"$environment")" == "false" ]]
          [[ "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"$environment")" == "true" ]]
          branch_policies="$(read_gh_json relay-branch-policies "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1/deployment-branch-policies")"
          [[ "$(jq -r '(.total_count == 1) and ((.branch_policies | length) == 1) and ([.branch_policies[] | select(.name == "main" and .type == "branch")] | length == 1)' <<<"$branch_policies")" == "true" ]]
          successor_title="robin-$MODE-relay-$GENERATION-$GITHUB_RUN_ID-1"
          successor_result="$(python -I scripts/reconcile_robin_relay_successor.py \
            --repository "$GITHUB_REPOSITORY" \
            --mode "$MODE" \
            --generation "$GENERATION" \
            --chain-id "$GITHUB_RUN_ID" \
            --parent-run-id "$GITHUB_RUN_ID" \
            --sequence 1 \
            --successor-title "$successor_title" \
            --active-prefix "robin-$MODE-relay-$GENERATION-")"
          [[ "$(jq -r .skipped_active <<<"$successor_result")" == "false" ]] || exit 0
          successor="$(jq -c .successor <<<"$successor_result")"
          [[ "$(jq -r .workflow_id <<<"$successor")" == "321915839" ]]
          [[ "$(jq -r .event <<<"$successor")" == "workflow_dispatch" ]]
          [[ "$(jq -r .head_branch <<<"$successor")" == "main" ]]
          [[ "$(jq -r .run_attempt <<<"$successor")" == "1" ]]
          [[ "$(jq -r .actor.login <<<"$successor")" == "github-actions[bot]" ]]
          successor_sha="$(jq -r .head_sha <<<"$successor")"
          validate_documentary_continuity "$GITHUB_SHA" "$successor_sha"

  watchdog:
    if: >-
      github.event_name == 'schedule' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Restart a missing relay without touching provider or R2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_GENERATION: ${{ vars.ROBIN_AUTONOMOUS_RELAY_GENERATION }}
          EXPECTED_GENERATION: "4c150973fc3d486e3738f80716019839ac2c4126644849d336e267e6929e6d87"
          EXPECTED_EXPIRES_AT: "2026-11-03T23:59:59Z"
        run: |
          set -euo pipefail
          read_gh_json() {
            local label="$1"
            local endpoint="$2"
            local payload=""
            local attempt
            for attempt in 1 2 3; do
              if payload="$(timeout --kill-after=5s 20s gh api "$endpoint")" && [[ -n "$payload" ]] && jq -e . >/dev/null 2>&1 <<<"$payload"; then
                printf '%s\n' "$payload"
                return 0
              fi
              echo "GitHub API JSON read attempt $attempt/3 failed: $label" >&2
              (( attempt == 3 )) || sleep "$attempt"
            done
            echo "GitHub API JSON read failed after 3 attempts: $label" >&2
            return 1
          }
          validate_documentary_continuity() {
            local base_sha="$1"
            local head_sha="$2"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --force origin "$head_sha"
            python -I scripts/validate_robin_documentary_continuity.py \
              --repository . --base "$base_sha" --head "$head_sha"
          }
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "schedule" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "dddur75/robin-stades-ng/.github/workflows/prospective-deep-scheduler.yml@refs/heads/main" ]]
          [[ "$ACTIVE_GENERATION" == "$EXPECTED_GENERATION" ]] || exit 0
          current_main="$(read_gh_json main-ref "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_main_sha="$(jq -r .object.sha <<<"$current_main")"
          validate_documentary_continuity "$GITHUB_SHA" "$current_main_sha"
          expiry_epoch="$(date -u -d "$EXPECTED_EXPIRES_AT" +%s)"
          current_epoch="$(date -u +%s)"
          (( current_epoch + 60 * 60 + 10800 <= expiry_epoch )) || exit 0
          environment="$(read_gh_json relay-environment "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1")"
          [[ "$(jq -r '[.protection_rules[].type] | sort == ["branch_policy", "wait_timer"]' <<<"$environment")" == "true" ]]
          [[ "$(jq -r '[.protection_rules[] | select(.type == "wait_timer") | .wait_timer] | if length == 1 then .[0] else -1 end' <<<"$environment")" == "60" ]]
          [[ "$(jq -r '.deployment_branch_policy.protected_branches' <<<"$environment")" == "false" ]]
          [[ "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"$environment")" == "true" ]]
          branch_policies="$(read_gh_json relay-branch-policies "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1/deployment-branch-policies")"
          [[ "$(jq -r '(.total_count == 1) and ((.branch_policies | length) == 1) and ([.branch_policies[] | select(.name == "main" and .type == "branch")] | length == 1)' <<<"$branch_policies")" == "true" ]]
          successor_title="robin-collect-relay-$EXPECTED_GENERATION-$GITHUB_RUN_ID-1"
          successor_result="$(python -I scripts/reconcile_robin_relay_successor.py \
            --repository "$GITHUB_REPOSITORY" \
            --mode collect \
            --generation "$EXPECTED_GENERATION" \
            --chain-id "$GITHUB_RUN_ID" \
            --parent-run-id "$GITHUB_RUN_ID" \
            --sequence 1 \
            --successor-title "$successor_title" \
            --active-prefix "robin-collect-relay-$EXPECTED_GENERATION-")"
          [[ "$(jq -r .skipped_active <<<"$successor_result")" == "false" ]] || exit 0
          successor="$(jq -c .successor <<<"$successor_result")"
          [[ "$(jq -r .workflow_id <<<"$successor")" == "321915839" ]]
          [[ "$(jq -r .event <<<"$successor")" == "workflow_dispatch" ]]
          [[ "$(jq -r .head_branch <<<"$successor")" == "main" ]]
          [[ "$(jq -r .run_attempt <<<"$successor")" == "1" ]]
          [[ "$(jq -r .actor.login <<<"$successor")" == "github-actions[bot]" ]]
          successor_sha="$(jq -r .head_sha <<<"$successor")"
          validate_documentary_continuity "$GITHUB_SHA" "$successor_sha"

  relay:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.origin == 'relay' &&
      github.actor == 'github-actions[bot]' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    permissions:
      actions: write
      contents: read
    environment: robin-autonomous-relay-v1
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      collect: ${{ steps.relay.outputs.collect }}
      probe_complete: ${{ steps.relay.outputs.probe_complete }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Validate automatic parent and arm successor before collection
        id: relay
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          ORIGIN: ${{ inputs.origin }}
          GENERATION: ${{ inputs.generation }}
          CHAIN_ID: ${{ inputs.chain_id }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          SEQUENCE: ${{ inputs.sequence }}
          ACTIVE_GENERATION: ${{ vars.ROBIN_AUTONOMOUS_RELAY_GENERATION }}
          EXPECTED_GENERATION: "4c150973fc3d486e3738f80716019839ac2c4126644849d336e267e6929e6d87"
          EXPECTED_EXPIRES_AT: "2026-11-03T23:59:59Z"
        run: |
          set -euo pipefail
          umask 077
          read_gh_json() {
            local label="$1"
            local endpoint="$2"
            local payload=""
            local attempt
            for attempt in 1 2 3; do
              if payload="$(timeout --kill-after=5s 20s gh api "$endpoint")" && [[ -n "$payload" ]] && jq -e . >/dev/null 2>&1 <<<"$payload"; then
                printf '%s\n' "$payload"
                return 0
              fi
              echo "GitHub API JSON read attempt $attempt/3 failed: $label" >&2
              (( attempt == 3 )) || sleep "$attempt"
            done
            echo "GitHub API JSON read failed after 3 attempts: $label" >&2
            return 1
          }
          validate_documentary_continuity() {
            local base_sha="$1"
            local head_sha="$2"
            [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
            [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
            git fetch --no-tags --force origin "$head_sha"
            python -I scripts/validate_robin_documentary_continuity.py \
              --repository . --base "$base_sha" --head "$head_sha"
          }
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "dddur75/robin-stades-ng/.github/workflows/prospective-deep-scheduler.yml@refs/heads/main" ]]
          [[ "$MODE" == "probe" || "$MODE" == "collect" ]]
          [[ "$ORIGIN" == "relay" ]]
          [[ "$GENERATION" == "$EXPECTED_GENERATION" ]]
          [[ "$CHAIN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$PARENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$SEQUENCE" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$PARENT_RUN_ID" != "$GITHUB_RUN_ID" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-trigger-recovery-v2-20261005.json | cut -d' ' -f1)" == "$EXPECTED_GENERATION" ]]
          current_main="$(read_gh_json main-ref "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          current_main_sha="$(jq -r .object.sha <<<"$current_main")"
          validate_documentary_continuity "$GITHUB_SHA" "$current_main_sha"
          parent="$(read_gh_json parent-run "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID")"
          [[ "$(jq -r .id <<<"$parent")" == "$PARENT_RUN_ID" ]]
          [[ "$(jq -r .workflow_id <<<"$parent")" == "321915839" ]]
          [[ "$(jq -r .head_branch <<<"$parent")" == "main" ]]
          parent_sha="$(jq -r .head_sha <<<"$parent")"
          validate_documentary_continuity "$parent_sha" "$GITHUB_SHA"
          [[ "$(jq -r .run_attempt <<<"$parent")" == "1" ]]
          parent_event="$(jq -r .event <<<"$parent")"
          parent_title="$(jq -r .display_title <<<"$parent")"
          [[ "$parent_event" == "workflow_dispatch" || "$parent_event" == "schedule" ]]
          if [[ "$SEQUENCE" == "1" ]]; then
            [[ "$CHAIN_ID" == "$PARENT_RUN_ID" ]]
            [[ "$(jq -r .conclusion <<<"$parent")" == "success" ]]
            if [[ "$parent_event" == "workflow_dispatch" ]]; then
              [[ "$parent_title" == "robin-$MODE-bootstrap-$GENERATION-0-0" ]]
            else
              [[ "$MODE" == "collect" ]]
              [[ "$parent_title" == "robin-watchdog-schedule-none-$PARENT_RUN_ID-0" ]]
            fi
          else
            [[ "$parent_event" == "workflow_dispatch" ]]
            previous_sequence="$((10#$SEQUENCE - 1))"
            [[ "$parent_title" == "robin-$MODE-relay-$GENERATION-$CHAIN_ID-$previous_sequence" ]]
            parent_jobs="$(read_gh_json parent-jobs "repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")"
            [[ "$(jq -r '[.jobs[] | select(.name == "relay" and .conclusion == "success")] | length' <<<"$parent_jobs")" == "1" ]]
          fi
          environment="$(read_gh_json relay-environment "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1")"
          expected_wait="1"
          [[ "$MODE" == "probe" ]] || expected_wait="60"
          [[ "$(jq -r '[.protection_rules[].type] | sort == ["branch_policy", "wait_timer"]' <<<"$environment")" == "true" ]]
          [[ "$(jq -r '[.protection_rules[] | select(.type == "wait_timer") | .wait_timer] | if length == 1 then .[0] else -1 end' <<<"$environment")" == "$expected_wait" ]]
          [[ "$(jq -r '.deployment_branch_policy.protected_branches' <<<"$environment")" == "false" ]]
          [[ "$(jq -r '.deployment_branch_policy.custom_branch_policies' <<<"$environment")" == "true" ]]
          branch_policies="$(read_gh_json relay-branch-policies "repos/$GITHUB_REPOSITORY/environments/robin-autonomous-relay-v1/deployment-branch-policies")"
          [[ "$(jq -r '(.total_count == 1) and ((.branch_policies | length) == 1) and ([.branch_policies[] | select(.name == "main" and .type == "branch")] | length == 1)' <<<"$branch_policies")" == "true" ]]
          current_run="$(read_gh_json current-run "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          current_run_created_at="$(jq -r .created_at <<<"$current_run")"
          created_epoch="$(date -u -d "$current_run_created_at" +%s)"
          current_epoch="$(date -u +%s)"
          (( current_epoch - created_epoch >= expected_wait * 60 ))
          expiry_epoch="$(date -u -d "$EXPECTED_EXPIRES_AT" +%s)"
          echo "collect=false" >> "$GITHUB_OUTPUT"
          echo "probe_complete=false" >> "$GITHUB_OUTPUT"
          (( current_epoch <= expiry_epoch )) || exit 0
          if [[ "$MODE" == "collect" ]]; then
            [[ "$ACTIVE_GENERATION" == "$EXPECTED_GENERATION" ]]
            (( current_epoch + 10800 <= expiry_epoch )) || exit 0
            (( current_epoch + 60 * 60 + 10800 <= expiry_epoch )) || exit 0
          elif [[ "$SEQUENCE" == "2" ]]; then
            echo "probe_complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            [[ "$SEQUENCE" == "1" ]]
            (( current_epoch + expected_wait * 60 + 600 <= expiry_epoch ))
          fi
          next_sequence="$((10#$SEQUENCE + 1))"
          successor_title="robin-$MODE-relay-$GENERATION-$CHAIN_ID-$next_sequence"
          successor_result="$(python -I scripts/reconcile_robin_relay_successor.py \
            --repository "$GITHUB_REPOSITORY" \
            --mode "$MODE" \
            --generation "$GENERATION" \
            --chain-id "$CHAIN_ID" \
            --parent-run-id "$GITHUB_RUN_ID" \
            --sequence "$next_sequence" \
            --successor-title "$successor_title")"
          [[ "$(jq -r .skipped_active <<<"$successor_result")" == "false" ]]
          successor="$(jq -c .successor <<<"$successor_result")"
          [[ "$(jq -r .workflow_id <<<"$successor")" == "321915839" ]]
          [[ "$(jq -r .event <<<"$successor")" == "workflow_dispatch" ]]
          [[ "$(jq -r .head_branch <<<"$successor")" == "main" ]]
          [[ "$(jq -r .run_attempt <<<"$successor")" == "1" ]]
          [[ "$(jq -r .actor.login <<<"$successor")" == "github-actions[bot]" ]]
          successor_sha="$(jq -r .head_sha <<<"$successor")"
          validate_documentary_continuity "$GITHUB_SHA" "$successor_sha"
          latest_main="$(read_gh_json main-ref-after-successor "repos/$GITHUB_REPOSITORY/git/ref/heads/main")"
          latest_main_sha="$(jq -r .object.sha <<<"$latest_main")"
          validate_documentary_continuity "$GITHUB_SHA" "$latest_main_sha"
          validate_documentary_continuity "$successor_sha" "$latest_main_sha"
          if [[ "$MODE" == "collect" ]]; then
            echo "collect=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish provider-free relay summary
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          CHAIN_ID: ${{ inputs.chain_id }}
          PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          SEQUENCE: ${{ inputs.sequence }}
          PROBE_COMPLETE: ${{ steps.relay.outputs.probe_complete }}
        run: |
          {
            echo "# Robin autonomous relay"
            echo
            echo "- Mode: \`$MODE\`"
            echo "- Chain: \`$CHAIN_ID\`"
            echo "- Parent: \`$PARENT_RUN_ID\`"
            echo "- Sequence: \`$SEQUENCE\`"
            echo "- Probe complete: \`$PROBE_COMPLETE\`"
            echo "- Provider requests: \`0\` before the isolated capture job"
          } >> "$GITHUB_STEP_SUMMARY"

  capture:
    needs: relay
    if: >-
      needs.relay.result == 'success' &&
      needs.relay.outputs.collect == 'true'
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
