          assert datetime.datetime.now(datetime.UTC) + datetime.timedelta(hours=3) <= expires
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SOURCE_SHA256"
          ]
          assert hashlib.sha256(schedule_manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SCHEDULE_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(schedule_source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_SCHEDULE_SOURCE_SHA256"
          ]
          assert hashlib.sha256(established_manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_ESTABLISHED_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(established_source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_ESTABLISHED_SOURCE_SHA256"
          ]
          assert hashlib.sha256(trigger_manifest_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_TRIGGER_MANIFEST_SHA256"
          ]
          assert hashlib.sha256(trigger_source_path.read_bytes()).hexdigest() == os.environ[
              "EXPECTED_TRIGGER_SOURCE_SHA256"
          ]
          PY

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.10"

      - name: Install exact existing runtime dependencies
        id: install
        run: >-
          python -I -m pip install --only-binary=:all: --require-hashes -r requirements-data-torrent.lock

      - name: Revalidate documentary continuity immediately before collection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          git fetch --no-tags --force origin "$current_main_sha"
          python -I scripts/validate_robin_documentary_continuity.py \
            --repository . --base "$GITHUB_SHA" --head "$current_main_sha"

      - name: Prepare normalized delivery directory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "$RUNNER_TEMP/robin-autonomous-lab"

      - name: Collect one admitted recurring slot
        id: capture
        continue-on-error: true
        shell: bash
        env:
          THE_ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          ROBIN_RELAY_MODE: ${{ inputs.mode }}
          ROBIN_RELAY_ORIGIN: ${{ inputs.origin }}
          ROBIN_RELAY_GENERATION: ${{ inputs.generation }}
          ROBIN_RELAY_CHAIN_ID: ${{ inputs.chain_id }}
          ROBIN_RELAY_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          ROBIN_RELAY_SEQUENCE: ${{ inputs.sequence }}
        run: |
          set -euo pipefail
          python -I scripts/run_recurring_real_data.py \
            --execute ROBIN_AUTONOMOUS_LAB_20261004 \
            --manifest configs/execution/robin-autonomous-lab-20261004.json \
            --output-directory "$RUNNER_TEMP/robin-autonomous-lab"

      - name: Validate normalized delivery and publish run summary
        id: validate
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python -I - <<'PY'
          import csv
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "robin-autonomous-lab"
          expected = {
              "public-receipt.json", "robin-real-data.json",
              "robin-real-data.csv", "robin-real-data.html",
          }
          descendants = list(root.rglob("*"))
          if any(path.is_symlink() or not path.is_file() for path in descendants):
              raise RuntimeError("RECURRING_NORMALIZED_TREE_INVALID")
          observed = {path.relative_to(root).as_posix() for path in descendants}
          missing = sorted(expected - observed)
          unexpected_count = len(observed - expected)
          if missing or unexpected_count:
              raise RuntimeError(
                  "RECURRING_NORMALIZED_FILE_SET_INVALID "
                  f"missing={','.join(missing) or 'none'} "
                  f"unexpected_count={unexpected_count}"
              )
          receipt = json.loads((root / "public-receipt.json").read_text(encoding="utf-8"))
          snapshot = json.loads((root / "robin-real-data.json").read_text(encoding="utf-8"))
          RECURRING_CLAIM_IDS = [
              "DATA.ROBIN.AUTONOMOUS_LAB.RECURRING_CAPTURES.V1.001",
              "DATA.ROBIN.AUTONOMOUS_LAB.RECURRING_VIEW.V1.001",
              "GOV.ROBIN.AUTONOMOUS_LAB.RECURRING_CONSUMPTION.V1.001",
          ]
          SEED_CLAIM_IDS = [
              "DATA.ROBIN.AUTONOMOUS_LAB.SEED_CAPTURES.V1.001",
              "DATA.ROBIN.AUTONOMOUS_LAB.SEED_VIEW.V1.001",
              "GOV.ROBIN.AUTONOMOUS_LAB.SEED_CONSUMPTION.V1.001",
          ]
          assert receipt["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert receipt["delivery_repository_sha"] == os.environ["GITHUB_SHA"]
          assert receipt["delivery_github_run_id"] == os.environ["GITHUB_RUN_ID"]
          assert receipt["status"] in {
              "REAL_DATA_COMPLETE", "REAL_DATA_PARTIAL", "REAL_DATA_FAILED"
          }
          if receipt["status"] in {"REAL_DATA_COMPLETE", "REAL_DATA_PARTIAL"}:
              assert receipt["validated_capture_count"] > 0
          assert receipt["provider_requests_new"] <= 5
          assert receipt["provider_requests_reserved"] == 5
          assert receipt["provider_credits_reserved"] == 10
          assert receipt["rolling_24h_requests"] <= 140
          assert receipt["rolling_24h_credits"] <= 280
          assert receipt["rolling_30d_requests"] <= 4000
          assert receipt["rolling_30d_credits"] <= 8000
          assert isinstance(receipt["credit_bound_valid"], bool)
          assert receipt["automatic_retries"] == 0
          assert receipt["purchases"] == receipt["real_bets"] == 0
          assert receipt["backfills"] == receipt["promotions"] == 0
          assert receipt["private_report_r2_status"] == "VERIFIED"
          assert snapshot["schema_version"] == "robin-real-data-explorer-v2"
          assert snapshot["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert len(snapshot["rows"]) == receipt["display_row_count"]
          assert snapshot["summary"]["row_count"] == receipt["display_row_count"]
          assert snapshot["data_role"] == receipt["display_data_role"]
          assert snapshot["data_slot_start_utc"] == receipt["display_data_slot_start_utc"]
          assert receipt["claim_ids"] == snapshot["claim_ids"]
          assert receipt["claim_ids"] in [
              RECURRING_CLAIM_IDS,
              RECURRING_CLAIM_IDS + SEED_CLAIM_IDS,
          ]
          if snapshot["data_role"] == "CURRENT":
              assert receipt["display_row_count"] == receipt["row_count"]
          else:
              assert snapshot["data_role"] == "CARRY_FORWARD_STALE"
              assert snapshot["collection_health"] == "FAILED"
              assert snapshot["freshness"]["status"] == "STALE"
              assert snapshot["data_slot_start_utc"] < receipt["slot_start_utc"]
              assert receipt["row_count"] == 0
          serialized = json.dumps(snapshot, sort_keys=True)
          assert "raw_payload_base64" not in serialized
          assert "raw_object_key" not in serialized
          assert '"branches"' not in serialized
          assert receipt["normalized_json_sha256"] == hashlib.sha256(
              (root / "robin-real-data.json").read_bytes()
          ).hexdigest()
          assert receipt["csv_sha256"] == hashlib.sha256(
              (root / "robin-real-data.csv").read_bytes()
          ).hexdigest()
          assert receipt["html_sha256"] == hashlib.sha256(
              (root / "robin-real-data.html").read_bytes()
          ).hexdigest()
          with (root / "robin-real-data.csv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          assert len(rows) == receipt["display_row_count"]

          run_url = (
              f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
              f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          lines = [
              "# Robin — laboratoire autonome",
              "",
              f"- Statut : `{receipt['status']}`",
              f"- Créneau UTC : `{receipt['slot_start_utc']}`",
              f"- Captures vérifiées : `{receipt['validated_capture_count']}/5`",
              f"- Lignes du créneau / affichées : `{receipt['row_count']}` / `{receipt['display_row_count']}`",
              f"- Requêtes glissantes 24 h : `{receipt['rolling_24h_requests']}/140`",
              f"- Crédits glissants 24 h : `{receipt['rolling_24h_credits']}/280`",
              f"- Claim IDs : `{', '.join(receipt['claim_ids'])}`",
              f"- Run : {run_url}",
              "",
              "Le tableau HTML, le JSON normalisé et le CSV sont dans l’artifact de ce run. Le brut et le rapport privé restent dans R2.",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(lines) + "\n")
          PY

      - name: Upload consultable normalized table
        id: upload
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: robin-autonomous-lab-${{ github.run_id }}
          path: ${{ runner.temp }}/robin-autonomous-lab
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 30

      - name: Preserve exact terminal outcome
        id: terminal
        if: ${{ always() }}
        shell: bash
        env:
          CAPTURE_OUTCOME: ${{ steps.capture.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          if [[ "$CAPTURE_OUTCOME" == "success" \
             && "$VALIDATE_OUTCOME" == "success" \
             && "$UPLOAD_OUTCOME" == "success" ]]; then
            exit 0
          fi
          echo "RECURRING_DELIVERY_INCOMPLETE" >&2
          exit 1
