      - name: Verify current authority and retire every prior provider route
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MANIFEST_SHA256: "98b1538384f942d54535517e445ab2e9bf347e080b7f20bc92f3bb02aaede00a"
          EXPECTED_SOURCE_SHA256: "c611e5cfdb2fb6bc2b1a6238e7bc8ec94191d4841c9cad177abcf6bb8662a813"
          EXPECTED_SCHEDULE_MANIFEST_SHA256: "0905b3044849b81ea0f574f066e8ae132e61f0deb5412a8a6743d2ab0c15e0bc"
          EXPECTED_SCHEDULE_SOURCE_SHA256: "7e654d17751685b62aff5ab0a7c9d0460feaabd8b304f1ee80c5fd80596cd65c"
          EXPECTED_ESTABLISHED_MANIFEST_SHA256: "c1e3375370f55f288aaa76a5e706939e5617a54dc61598f85a510fc9d3be14fd"
          EXPECTED_ESTABLISHED_SOURCE_SHA256: "2cf16116c41803c3300bee2fc7cc3cc501b09fa5f80c6c27affce08589e5f84e"
          EXPECTED_TRIGGER_MANIFEST_SHA256: "4c150973fc3d486e3738f80716019839ac2c4126644849d336e267e6929e6d87"
          EXPECTED_TRIGGER_SOURCE_SHA256: "1bd2073ac01f68fbaa1de9c190642245c2bf8acf7c3611f69f706159df96821d"
          ACTIVE_GENERATION: ${{ vars.ROBIN_AUTONOMOUS_RELAY_GENERATION }}
          ROBIN_RELAY_MODE: ${{ inputs.mode }}
          ROBIN_RELAY_ORIGIN: ${{ inputs.origin }}
          ROBIN_RELAY_GENERATION: ${{ inputs.generation }}
          ROBIN_RELAY_CHAIN_ID: ${{ inputs.chain_id }}
          ROBIN_RELAY_PARENT_RUN_ID: ${{ inputs.parent_run_id }}
          ROBIN_RELAY_SEQUENCE: ${{ inputs.sequence }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$GITHUB_REPOSITORY" == "dddur75/robin-stades-ng" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_ACTOR" == "github-actions[bot]" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "dddur75/robin-stades-ng/.github/workflows/prospective-deep-scheduler.yml@refs/heads/main" ]]
          [[ "$GITHUB_RUN_ATTEMPT" == "1" ]]
          [[ "$ROBIN_RELAY_MODE" == "collect" ]]
          [[ "$ROBIN_RELAY_ORIGIN" == "relay" ]]
          [[ "$ROBIN_RELAY_GENERATION" == "$EXPECTED_TRIGGER_MANIFEST_SHA256" ]]
          [[ "$ACTIVE_GENERATION" == "$EXPECTED_TRIGGER_MANIFEST_SHA256" ]]
          [[ "$ROBIN_RELAY_CHAIN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ROBIN_RELAY_PARENT_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ROBIN_RELAY_SEQUENCE" =~ ^[1-9][0-9]{0,9}$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ -z "$(git status --porcelain)" ]]
          current_main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          git fetch --no-tags --force origin "$current_main_sha"
          python -I scripts/validate_robin_documentary_continuity.py \
            --repository . --base "$GITHUB_SHA" --head "$current_main_sha"
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-20261004.json | cut -d' ' -f1)" == "$EXPECTED_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_SOURCE_SHA256" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-schedule-reliability-20261004.json | cut -d' ' -f1)" == "$EXPECTED_SCHEDULE_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-SCHEDULE-RELIABILITY-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_SCHEDULE_SOURCE_SHA256" ]]
          [[ "$(sha256sum configs/execution/robin-autonomous-lab-established-scheduler-20261004.json | cut -d' ' -f1)" == "$EXPECTED_ESTABLISHED_MANIFEST_SHA256" ]]
          [[ "$(sha256sum docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-ESTABLISHED-SCHEDULER-2026-10-04.md | cut -d' ' -f1)" == "$EXPECTED_ESTABLISHED_SOURCE_SHA256" ]]
