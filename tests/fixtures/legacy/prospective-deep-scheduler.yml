          assert established_manifest["maximum_stage"] == manifest["maximum_stage"] == "E3B"
          assert established_manifest["compute_budget"] == manifest["compute_budget"]
          assert established_manifest["time_budget"] == manifest["time_budget"]
          assert established_manifest["expires_at"] == manifest["expires_at"]
          assert established_manifest["source_hash"] == os.environ[
              "EXPECTED_ESTABLISHED_SOURCE_SHA256"
          ]
          assert set(established_manifest["external_effects"]) == {
              "github_actions_established_workflow_id_321915839",
              "github_actions_schedule_hourly_minute_13",
              "github_actions_prior_workflow_id_374470410_disabled",
