              "compute_budget", "time_budget", "source_hash", "expires_at",
          }
          assert manifest["mission_id"] == "ROBIN_AUTONOMOUS_LAB_20261004"
          assert manifest["authorized_stages"] == ["E1", "E2", "E3A", "E3B"]
          assert manifest["maximum_stage"] == "E3B"
          assert manifest["source_hash"] == os.environ["EXPECTED_SOURCE_SHA256"]
          assert set(schedule_manifest) == set(manifest)
          assert set(established_manifest) == set(manifest)
          assert set(trigger_manifest) == set(manifest)
          assert schedule_manifest["mission_id"] == (
              "ROBIN_AUTONOMOUS_LAB_SCHEDULE_RELIABILITY_20261004"
          )
          assert schedule_manifest["authorized_stages"] == manifest["authorized_stages"]
          assert schedule_manifest["maximum_stage"] == manifest["maximum_stage"] == "E3B"
          assert schedule_manifest["compute_budget"] == manifest["compute_budget"]
          assert schedule_manifest["time_budget"] == manifest["time_budget"]
