              assert response["state"] == "disabled_manually"

          manifest_path = Path("configs/execution/robin-autonomous-lab-20261004.json")
          source_path = Path("docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-2026-10-04.md")
          schedule_manifest_path = Path(
              "configs/execution/robin-autonomous-lab-schedule-reliability-20261004.json"
          )
          schedule_source_path = Path(
              "docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-SCHEDULE-RELIABILITY-2026-10-04.md"
          )
          established_manifest_path = Path(
              "configs/execution/robin-autonomous-lab-established-scheduler-20261004.json"
          )
          established_source_path = Path(
              "docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-ESTABLISHED-SCHEDULER-2026-10-04.md"
          )
          trigger_manifest_path = Path(
              "configs/execution/robin-autonomous-lab-trigger-recovery-v2-20261005.json"
          )
          trigger_source_path = Path(
              "docs/data-sourcing/ROBIN-AUTONOMOUS-LAB-TRIGGER-RECOVERY-V2-2026-10-05.md"
          )
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          schedule_manifest = json.loads(
              schedule_manifest_path.read_text(encoding="utf-8")
          )
          established_manifest = json.loads(
